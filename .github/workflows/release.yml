name: Release

on:
  push:
    tags:
      - "v20*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish macOS arm64 release
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          version: 2026.8.10
          cache: false
          github_token: ""

      - name: Install Rust quality components
        run: rustup component add rustfmt clippy

      - name: Verify release identity and quality gates
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          mise run ci

      - name: Build, sign, and notarize
        shell: bash
        env:
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          SOSUS_NOTARY_PROFILE: sosus-notary
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/sosus-developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey.p8"
          keychain="$RUNNER_TEMP/sosus-signing.keychain-db"

          printf '%s' "$MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 --decode >"$certificate"
          security create-keychain -p "$MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD" "$keychain"

          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 --decode >"$api_key"
          xcrun notarytool store-credentials "$SOSUS_NOTARY_PROFILE" \
            --key "$api_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID"
          rm -f "$certificate" "$api_key"

          mise run release

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=$(find dist -maxdepth 1 -type f -name 'sosus-*-macos-arm64.zip' -print -quit)
          test -n "$archive"
          arguments=(release create "$GITHUB_REF_NAME" --title "sosus ${GITHUB_REF_NAME#v}" --generate-notes "$archive" "$archive.sha256")
          if [[ "$GITHUB_REF_NAME" == *-beta.* ]]; then
            arguments+=(--prerelease)
          fi
          gh "${arguments[@]}"
