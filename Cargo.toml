[package]
name = "sosus"
version = "2026.8.24-beta.5"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local-first meeting intelligence for macOS"

[features]
default = []
model-tests = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18.2"
crossterm = { version = "0.29", features = ["event-stream"] }
etcetera = "0.11"
hound = "3"
libc = "0.2"
num_cpus = "1"
ratatui = { version = "0.30.1", features = ["crossterm_0_29"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
regex = "1"
rtrb = "0.4.0"
rubato = "0.15.0"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5.5", default-features = false, features = ["all"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "local-offset", "parsing", "serde"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.4"
toml_edit = "0.25.13"
tracing = "0.1"
tracing-subscriber = "0.3"
sherpa-onnx = "1.13.5"
whisper-rs = { git = "https://github.com/codechips/whisper-rs", rev = "5003449", features = ["metal", "tracing_backend"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", default-features = false, features = ["alloc"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["AVAudioApplication", "block2"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFString"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSUUID", "NSValue"] }

[profile.release]
strip = true
